name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
      - name: Uloz pliki w foldery
        run: |
          J=src/main/java/pl/sakurasky
          R=src/main/resources
          mkdir -p $J/gui $J/mixin $R/assets/sakurasky/lang $R/assets/sakurasky/textures/particle
          mv Config.java ParticleKind.java ParticleLayer.java SakuraSkyClient.java $J/
          mv SkyScreen.java $J/gui/
          mv EnvironmentAttributeProbeMixin.java $J/mixin/
          mv fabric.mod.json sakurasky.mixins.json $R/
          mv en_us.json pl_pl.json $R/assets/sakurasky/lang/
          mv dust.png firefly.png sakura.png snow.png spark.png $R/assets/sakurasky/textures/particle/
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: sakurasky-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
